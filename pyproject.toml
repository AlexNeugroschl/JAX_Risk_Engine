[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-risk-engine"
version = "0.1.0"
description = "JAX-based market simulation and trade pricing engine built to run across multiple TPUs, mirroring ORE (Open Source Risk Engine)."
requires-python = ">=3.11"
dependencies = [
    "open-source-risk-engine",
    "pandas",
    "jax",
    "jaxlib",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
]
dev = [
    "pytest",
    "httpx",
    # Validates published EOD documents against the JSON Schemas
    # `engine.integration.schema` derives (W1.6.2). Test-only on purpose:
    # the engine emits the schema and must never depend on a validator to
    # produce a correct document. It is the *tests* that prove the two
    # agree -- see tests/test_integration_schema.py.
    "jsonschema",
]
profiling = [
    # XProf bundles the TensorBoard Profiler plugin + a standalone `xprof`
    # viewer. Only needed to collect/view a `jax.profiler.trace` timeline of a
    # pricing job -- see engine/portfolio/worker_pool.py::_run_pricing_job's
    # JAX_RISK_PROFILE_DIR opt-in and docs/getting-started/user-guide.md.
    "xprof",
]

[tool.setuptools.packages.find]
include = ["engine*"]
