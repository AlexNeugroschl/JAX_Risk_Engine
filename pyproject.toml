[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-risk-engine"
version = "0.1.0"
description = "JAX-based market simulation and trade pricing engine built to run across multiple TPUs, mirroring ORE (Open Source Risk Engine)."
requires-python = ">=3.11"
# Ranges, not pins: the exact verified versions live in constraints.txt.
# jax, jaxlib and ORE are bounded on both sides because the 1e-12 ORE-parity
# tolerances depend on their numerics, and a minor release of any of them can
# move results. Widen a bound only after a full suite run on the new version.
dependencies = [
    "open-source-risk-engine>=1.8.16,<1.9",
    "pandas",
    "jax>=0.10.2,<0.11",
    "jaxlib>=0.10.2,<0.11",
    "numpy",
    "scipy",
]

# The engine worker behind the HTTP API (decision A-14; engine/api/worker.py). The API
# starts one itself unless JAX_RISK_WORKER=external.
[project.scripts]
jax-risk-worker = "engine.api.worker:main"

[project.optional-dependencies]
api = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
]
dev = [
    "pytest",
    "httpx",
    # Validates published EOD documents against the JSON Schemas
    # `engine.traderx.schema` derives (W1.6.2). Test-only on purpose:
    # the engine emits the schema and must never depend on a validator to
    # produce a correct document. It is the *tests* that prove the two
    # agree -- see tests/test_traderx_schema.py.
    "jsonschema",
    # Runs the suite in parallel processes (`pytest -n auto`); see
    # docs/getting-started/user-guide.md, "Running the tests".
    "pytest-xdist",
]
# JAX's CUDA 13 plugin and the CUDA libraries, for an NVIDIA GPU on Linux (WSL2 on Windows,
# where JAX has no CUDA build). CUDA 13 runs every NVIDIA architecture JAX supports, Blackwell
# included, on a driver of 580 or later. See docs/getting-started/user-guide.md, "On a GPU".
gpu = [
    "jax[cuda13]>=0.10.2,<0.11",
]
# Installation candidate at JAX's compatible libtpu version; target correctness remains I-121.
tpu = [
    "jax[tpu]>=0.10.2,<0.11",
    "libtpu==0.0.42; sys_platform == 'linux'",
]
profiling = [
    # XProf bundles the TensorBoard Profiler plugin + a standalone `xprof`
    # viewer. Only needed to collect/view a `jax.profiler.trace` timeline of a
    # pricing job -- see engine/api/worker.py::_profiled's
    # JAX_RISK_PROFILE_DIR opt-in and docs/getting-started/user-guide.md.
    "xprof",
]
benchmark = [
    # The end-to-end benchmark submits and retrieves real HTTP API jobs.
    "httpx",
    # Standalone PDF/PNG scaling plots for demos/demo_gpu_scaling.py.
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["engine*"]

# The evidence table's rows (I-55), which every reduced-precision run reads to warn of figures
# without a passing row; generated by `python -m tests.support.precision_evidence`.
[tool.setuptools.package-data]
"engine.precision" = ["evidence.json"]

[tool.pytest.ini_options]
# `reference/` holds the ORE and TraderX submodules, with their own test
# trees; a bare `pytest` from the repo root must not wander into them.
testpaths = ["tests"]
# `slow` marks the tests CI's fast tier skips (`pytest -m "not slow"`): the
# HTTP-job and engine-worker tests that start worker processes, and tests taking
# 5 s or more. Every ORE-parity test runs in the fast tier, whatever it takes;
# only its statistical (L4) or swept extension is slow: the seeded sweeps'
# fixed sample runs fast, the rest of the sweep in the full tier.
# --strict-markers turns a misspelt marker into an error instead of
# a test that silently lands in the wrong tier.
addopts = "--strict-markers"
markers = [
    "slow: starts worker processes or takes 5 s or more; skipped by CI's fast tier",
    "ore_parity: the ORE parity matrix cells a test compares with ORE, and its tolerance (tests/support/ore_parity_matrix.py)",
]
