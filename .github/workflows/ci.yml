# Fast tier on every push to main and every pull request: the pinned
# environment (constraints.txt, via requirements.txt) and every test not
# marked `slow` -- unit, integration and ORE-parity tests. The slow tier
# (worker-pool and HTTP-job tests, a handful of long runs) is the `full` job,
# started by hand from the Actions tab. See docs/getting-started/user-guide.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # No submodules: reference/ORE and reference/traderX are read by humans,
      # and the one test that reads reference/traderX skips when it is absent.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m "not slow" -q --durations=15

  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --durations=25
