# Fast tier on every push to main and every pull request: the pinned
# environment (constraints.txt, via requirements.txt) and every test not
# marked `slow` -- unit, integration and ORE-parity tests. The slow tier
# (HTTP-job and engine-worker tests, a handful of long runs) is the `full` job,
# started by hand or weekly. The fast tier uses pytest-xdist; the full job uses
# bounded fresh processes so compiled programs do not accumulate across the suite (I-27). See
# docs/getting-started/user-guide.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # No submodules: reference/ORE and reference/traderX are read by humans,
      # and the one test that reads reference/traderX skips when it is absent.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m "not slow" -q -n auto --durations=15

  # The fast tier again under JAX's strict dtype promotion, which turns any implicit
  # float32/float64 mix into an error: kernels follow the dtype of their inputs, so a float32
  # stage stays float32 (docs/planning/details/precision.md §6.4).
  fast-strict-dtypes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JAX_NUMPY_DTYPE_PROMOTION: strict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m "not slow" -q -n auto --durations=15

  full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m benchmarks.test_suite --out .profile-out-ci-suite --batch-size 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-evidence
          path: .profile-out-ci-suite/
          include-hidden-files: true
          if-no-files-found: error
